    - MartinezImmunoblocker.SM_StaminaRegen_Rare
    - MartinezImmunoblocker.SM_HealthRegen_Rare
    - MartinezImmunoblocker.SM_Armor_Rare
    - MartinezImmunoblocker.SM_CritChance_Rare
    - MartinezImmunoblocker.SM_CritDamage_Rare

# ============================================================
# Status Effects — Immunoblocker tiers (timed buffs)
# ============================================================

BaseStatusEffect.MartinezSandevistan_Immunoblocker_Common:
  $type: gamedataStatusEffect_Record
  duration:
    $type: gamedataStatModifierGroup_Record
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        modifierType: Additive
        statType: BaseStats.MaxDuration
        value: 180.0
  VFX:
    - $type: gamedataStatusEffectFX_Record
      name: reflex_buster
      shouldReapply: false
  gameplayTags:
    - Buff
    - Immunoblocker
    - InhalerBuff
  maxStacks: RTDB.StatusEffect_inline0
  packages:
    - MartinezImmunoblocker.LP_Common
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true
