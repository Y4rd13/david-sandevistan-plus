    - InhalerBuff
  maxStacks: RTDB.StatusEffect_inline0
  packages:
    - MartinezImmunoblocker.LP_Uncommon
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: true
  uiData: BaseStatusEffect.SandevistanCooldown.uiData

BaseStatusEffect.MartinezSandevistan_Immunoblocker_Rare:
