# Common: basic neural stabilizer — recovery only
MartinezImmunoblocker.SM_StaminaRegen_Common:
  $type: gamedataConstantStatModifier_Record
  modifierType: Multiplier
  statType: BaseStats.StaminaRegenRate
  value: 1.15

MartinezImmunoblocker.SM_HealthRegen_Common:
  $type: gamedataConstantStatModifier_Record
  modifierType: Multiplier
  statType: BaseStats.HealthOutOfCombatRegenRate
  value: 1.1

# Uncommon: stronger dose — recovery + pain threshold (armor)
MartinezImmunoblocker.SM_StaminaRegen_Uncommon:
  $type: gamedataConstantStatModifier_Record
  modifierType: Multiplier
  statType: BaseStats.StaminaRegenRate
  value: 1.2

MartinezImmunoblocker.SM_HealthRegen_Uncommon:
  $type: gamedataConstantStatModifier_Record
  modifierType: Multiplier
  statType: BaseStats.HealthOutOfCombatRegenRate
