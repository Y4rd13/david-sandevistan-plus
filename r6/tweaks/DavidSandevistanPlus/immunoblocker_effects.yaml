  modifierType: Additive
  statType: BaseStats.CritChance
  value: 5.0

MartinezImmunoblocker.SM_CritDamage_Rare:
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  statType: BaseStats.CritDamage
  value: 10.0

# ============================================================
# Logic Packages (stat buff bundles applied while effect active)
# ============================================================

MartinezImmunoblocker.LP_Common:
  $type: gamedataGameplayLogicPackage_Record
  stats:
    - MartinezImmunoblocker.SM_StaminaRegen_Common
    - MartinezImmunoblocker.SM_HealthRegen_Common

MartinezImmunoblocker.LP_Uncommon:
  $type: gamedataGameplayLogicPackage_Record
  stats:
    - MartinezImmunoblocker.SM_StaminaRegen_Uncommon
    - MartinezImmunoblocker.SM_HealthRegen_Uncommon
    - MartinezImmunoblocker.SM_Armor_Uncommon

MartinezImmunoblocker.LP_Rare:
  $type: gamedataGameplayLogicPackage_Record
