<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" font-family="Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #0f1419; }
      .title { font-size: 22px; fill: #eceff1; font-weight: bold; }
      .subtitle { font-size: 12px; fill: #b0bec5; }
      .section-title { font-size: 14px; fill: #ffab91; font-weight: bold; }
      .node-bg { fill: #1a2a3a; stroke: #4fc3f7; stroke-width: 1.5; }
      .node-bg-pos { fill: #1a3a1a; stroke: #81c784; stroke-width: 1.5; }
      .node-bg-neg { fill: #3a1a1a; stroke: #ef5350; stroke-width: 1.5; }
      .node-bg-proc { fill: #4b1b1b; stroke: #ef5350; stroke-width: 2.5; }
      .node-text { font-size: 13px; fill: #eceff1; font-weight: bold; }
      .node-sub { font-size: 10px; fill: #b0bec5; }
      .branch { font-size: 11px; fill: #ffab91; font-style: italic; }
      .stage-chance { font-size: 11px; fill: #80deea; font-family: Consolas, monospace; }
      .timeline-axis { stroke: #607d8b; stroke-width: 1.5; }
      .timeline-tick { stroke: #455a64; stroke-width: 1; }
      .tick-label { font-size: 10px; fill: #b0bec5; }
      .event-label { font-size: 11px; fill: #ffab91; }
      .buff-label { font-size: 11px; fill: #eceff1; }
      .buff-val { font-size: 11px; fill: #80deea; font-family: Consolas, monospace; }
      .drain-text { font-size: 11px; fill: #ef5350; font-weight: bold; }
      .arrow { fill: #b0bec5; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" class="arrow"/>
