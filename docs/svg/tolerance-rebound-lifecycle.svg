  <text x="110.0" y="426" text-anchor="middle" class="table-cell">Uncommon (360s)</text>
  <text x="290.0" y="426" text-anchor="middle" class="table-cell">50%</text>
  <text x="470.0" y="426" text-anchor="middle" class="table-cell">+1.0</text>
  <text x="650.0" y="426" text-anchor="middle" class="table-cell">360s</text>
  <text x="830.0" y="426" text-anchor="middle" class="table-cell">+15 strain</text>
  <text x="1010.0" y="426" text-anchor="middle" class="table-cell">0.18/s</text>
  <rect x="20" y="446" width="1080" height="38" fill="#1a1a2e" opacity="0.4" rx="2"/>
  <text x="110.0" y="464" text-anchor="middle" class="table-cell">Rare Military (600s)</text>
