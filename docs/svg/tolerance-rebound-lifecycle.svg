  <path d="M 80.0,778.0 L 123.3,764.8 L 166.7,762.6 L 253.3,760.4 L 426.7,758.2 L 643.3,756.0 L 647.7,738.4 L 652.0,703.2 L 656.3,659.2 L 660.7,632.8 L 665.0,624.0 L 669.3,624.0 L 686.7,628.4 L 773.3,641.6 L 860.0,654.8 L 946.7,668.0 L 1033.3,681.2 L 1120.0,694.4" class="strain-line"/>
  <text x="669.3333333333334" y="615.2" text-anchor="middle" class="event-label" style="fill:#ef5350">+30 × tolerance mult</text>
  <text x="20" y="840" class="footnote">Rebound multiplier scales by current tolerance stage — ×1.0 / ×1.3 / ×1.6 / ×2.0. Severe-tolerance Rare crash hits +60 strain. Tier 1 adds Nosebleed VFX, Tier 2+ adds heavier tremor (0.008–0.012). 10s real-time cooldown between rebounds. Suppressed during Last Breath / menu / braindance.</text>
  <text x="20" y="855" class="footnote">Auto-Injector cyberware (Legendary, ~15k€$, Nervous System slot, Viktor) fires a single Rare blocker when strain conditions are met, then enters 120s cooldown. Each tolerance stage also bumps the prescription dose count required to clear the current cyberpsychosis stage.</text>
