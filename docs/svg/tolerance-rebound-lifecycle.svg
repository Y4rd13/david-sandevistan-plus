  <rect width="1180" height="880" class="bg"/>
  <text x="590" y="35" text-anchor="middle" class="title">Immunoblocker Tolerance + Rebound — Lifecycle</text>
  <text x="590" y="56" text-anchor="middle" class="subtitle">Body adapts to repeated doses, dose multiplier rises, expiry triggers rebound spike | immunoblocker_logic.lua</text>
  <text x="20" y="92" class="section-title">▼ Tolerance state machine (×1.0 → ×1.3 → ×1.6 → ×2.0 dose multiplier)</text>
  <circle cx="180" cy="195" r="60" class="stage-none"/>
  <text x="180" y="183" text-anchor="middle" class="stage-text">Stage 0</text>
  <text x="180" y="199" text-anchor="middle" class="stage-text" style="font-size:13px;fill:#80deea">None</text>
  <text x="180" y="217" text-anchor="middle" class="stage-sub" style="fill:#eceff1">dose ×1.0</text>
  <circle cx="430" cy="195" r="60" class="stage-mild"/>
  <text x="430" y="183" text-anchor="middle" class="stage-text">Stage 1</text>
  <text x="430" y="199" text-anchor="middle" class="stage-text" style="font-size:13px;fill:#80deea">Mild</text>
  <text x="430" y="217" text-anchor="middle" class="stage-sub" style="fill:#eceff1">dose ×1.3</text>
