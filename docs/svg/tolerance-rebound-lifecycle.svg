      .event-label { font-size: 11px; fill: #ffab91; }
      .table-cell { font-size: 12px; fill: #eceff1; }
      .table-head { font-size: 12px; fill: #1a1a2e; font-weight: bold; }
      .footnote { font-size: 10px; fill: #78909c; }
    </style>
