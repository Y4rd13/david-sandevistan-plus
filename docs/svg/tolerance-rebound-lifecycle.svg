  <path d="M 865 220 Q 805.0 285 745 220" class="arrow-down" marker-end="url(#arr_down)"/>
  <text x="555.0" y="300" text-anchor="middle" class="label-down">after Tolerance Decay Hours (default 24h game-time) of abstinence: -1.0 / game-day</text>
