<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" font-family="Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #0f1419; }
      .title { font-size: 22px; fill: #eceff1; font-weight: bold; }
      .subtitle { font-size: 12px; fill: #b0bec5; }
      .section-title { font-size: 14px; fill: #ffab91; font-weight: bold; }
      .stage-mild { fill: #1a2a3a; stroke: #80deea; stroke-width: 2; }
      .stage-mod  { fill: #2a3a1a; stroke: #aed581; stroke-width: 2; }
      .stage-sev  { fill: #3a2a1a; stroke: #ffb74d; stroke-width: 2; }
