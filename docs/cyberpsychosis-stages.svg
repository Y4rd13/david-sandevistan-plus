  <text x="30" y="906" class="footnote">Strain dice roll fires every 15s while strain ≥ threshold; chance = progress × 0.20 (progress = (strain - threshold) / (guaranteed - threshold), clamped 0..1). At guaranteed, episode is forced.</text>
  <text x="30" y="921" class="footnote">Strain sources: Sandy activation +5 (+3/overuse), Sandy active +2/min, Safety OFF +0.10/s, kills +2-6 by faction (gang=2, corpo=3, NCPD=5, civilian=6).</text>
  <text x="30" y="936" class="footnote">Kill strain bypasses stage multiplier (raw). Tolerance-based strain (activation, overuse, active-time, passive) scales 0.5× at stages 0-1, 0.75× at stage 2, 1.0× at stages 3+.</text>
  <text x="30" y="951" class="footnote">* Phantom lifetime: lover_stare behaviour stays at 4-6s regardless of stage (Lucy phantoms always brief). C = Common, U = Uncommon, R = Rare Military-Grade.</text>
  <text x="30" y="966" class="footnote">AA = involuntary Auto-Attack via AIWeapon.Fire (30s cooldown, 15m range). Treatment doses scale by tolerance stage: ×1.0 / ×1.3 / ×1.6 / ×2.0 for tolerance stages 0-3.</text>
  <text x="30" y="981" class="footnote">Martinez Rush chance is per-kill while Sandy active; gated by Edgerunner perk by default. Drains runtime ×1.5 during the window with a 3s stamina crash deferred to Sandy end.</text>
