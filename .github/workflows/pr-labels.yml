name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  area-labels:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true

  size-label:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: "10"
          s_max_size: "100"
          m_max_size: "300"
          l_max_size: "1000"
          fail_if_xl: "false"
          message_if_xl: >
            This PR exceeds 1000 lines. Mod diffs over this size often touch
            multiple subsystems at once. Consider splitting by area
            (HUD vs strain vs vendor, etc.) for easier review.
          files_to_ignore: |
            CHANGELOG.md
            docs/**
            **/*.svg
            **/*.bbcode
            wolven/temp/**

  type-label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const typeLabels = ['feature', 'bug', 'refactor', 'ci', 'test', 'chore', 'balance', 'tweak'];
            let newLabel = null;

            if (title.match(/^feat[\(!:]/)) newLabel = 'feature';
            else if (title.match(/^fix[\(!:]/)) newLabel = 'bug';
            else if (title.match(/^refactor[\(!:]/)) newLabel = 'refactor';
            else if (title.match(/^(ci|build)[\(!:]/)) newLabel = 'ci';
            else if (title.match(/^test[\(!:]/)) newLabel = 'test';
            else if (title.match(/^balance[\(!:]/)) newLabel = 'balance';
            else if (title.match(/^tweak[\(!:]/)) newLabel = 'tweak';
            else if (title.match(/^(chore|docs|style|perf|revert)[\(!:]/)) newLabel = 'chore';

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const staleLabels = currentLabels
              .filter(l => typeLabels.includes(l.name) && l.name !== newLabel)
              .map(l => l.name);

            for (const label of staleLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label
              });
            }

            if (newLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [newLabel]
              });
            }
