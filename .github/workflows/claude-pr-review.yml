name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "LICENSE"
      - "**/*.bbcode"
      - "wolven/temp/**"

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch PR discussion context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/fetch-pr-comments.sh

      - name: Build review prompt
        env:
          PROJECT_NAME: "David Sandevistan Plus, lore-accurate Cyberpunk 2077 Sandevistan mod"
          EVENT_ACTION: ${{ github.event.action }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'REVIEW_PROMPT<<PROMPT_EOF'
            echo '<pr_context>'
            echo "REPO: ${REPO_FULL}"
            echo "PROJECT: ${PROJECT_NAME}"
            echo "PR NUMBER: ${PR_NUMBER}"
            echo "EVENT: ${EVENT_ACTION}"
            echo '</pr_context>'
            echo '<existing_discussions>'
            cat /tmp/pr_comments_context.txt 2>/dev/null || echo 'No existing discussions.'
            echo '</existing_discussions>'
            echo '<review_instructions>'
            cat .github/prompts/pr-review.prompt.md
            echo '</review_instructions>'
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: |
            --model claude-opus-4-6
            --verbose
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git fetch:*)"
