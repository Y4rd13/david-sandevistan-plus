name: Issue Triage

on:
  issues:
    types: [opened, assigned]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: ${{ github.event.issue.user.login != 'github-actions[bot]' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build triage prompt
        env:
          PROJECT_NAME: "David Sandevistan Plus, lore-accurate Cyberpunk 2077 Sandevistan mod"
          REPO_FULL: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          {
            echo 'TRIAGE_PROMPT<<PROMPT_EOF'
            echo '<issue_context>'
            echo "REPO: ${REPO_FULL}"
            echo "PROJECT: ${PROJECT_NAME}"
            echo "ISSUE: #${ISSUE_NUMBER}"
            echo "AUTHOR: ${ISSUE_AUTHOR}"
            echo "EVENT: ${EVENT_ACTION}"
            echo '</issue_context>'
            echo '<triage_instructions>'
            cat .github/prompts/issue-triage.prompt.md
            echo '</triage_instructions>'
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: ${{ env.TRIAGE_PROMPT }}
          claude_args: |
            --model claude-opus-4-6
            --verbose
            --max-turns 20
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh api:*),mcp__github_comment__update_claude_comment"
